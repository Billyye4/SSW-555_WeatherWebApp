<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="styles/main.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main>
    <h1>Weather</h1>

    <form id="search">
      <input name="city" placeholder="Search for a city" aria-label="City" autocomplete="off" required>
      <button>Search</button>
    </form>

    <p id="status" role="status"></p>

    <section id="current-weather" class="card" hidden>
      <h2 data-field="place"></h2>
      <div class="now">
        <span data-field="icon" class="icon" aria-hidden="true"></span>
        <span data-field="temp" class="temp"></span>
      </div>
      <p data-field="desc"></p>
      <dl>
        <dt>Feels like</dt><dd data-field="feels"></dd>
        <dt>Humidity</dt><dd data-field="humidity"></dd>
        <dt>Wind</dt>
        <dd class="wind">
          <span data-field="wind"></span>
          <span data-field="windArrow" class="wind-arrow" role="img" hidden>↑</span>
        </dd>
      </dl>
    </section>

    <section id="rain-chance" class="card" hidden>
      <h2>Chance of rain</h2>
      <label class="field">
        <span>Date</span>
        <input type="date" data-field="date">
      </label>
      <p data-field="result" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
